<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/bot-avatar.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avin Saji | Software Engineer</title>
    <meta name="description" content="Software Engineer specializing in Java Vert.x, Spring Boot, Angular, AWS microservices, and high-performance cloud application architecture." />
    <meta name="author" content="Avin Saji" />
    <meta property="og:title" content="Avin Saji | Software Engineer" />
    <meta property="og:description" content="Software Engineer with experience building Java microservices, Vert.x reactive systems, Angular apps, and cloud deployment pipelines." />
    <meta property="og:image" content="/avatar.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Playfair Display, DM Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- Inline script to prevent Dark/Light Mode FOUC -->
    <script>
      (function() {
        const storedTheme = localStorage.getItem('theme');
        const userPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && userPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0b0d12] dark:text-slate-100 transition-colors duration-300 font-sans selection:bg-maroon-600 selection:text-white antialiased min-h-screen">
    <!-- Hidden Netlify Form detection helper for static bot parsing -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message" ></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
